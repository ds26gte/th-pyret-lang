language: node_js
dist: jammy
node_js:
- 22.5.1
cache:
  directories:
  - ide/node_modules
script:
- echo "hello world"
- npm install
- make
- npm run web
- cd ide && npm install && npm run build && cd ..
before_deploy:
  - echo ".pyret/compiled" >> .gitignore
  - echo build/phaseA >> .gitignore
  - echo build/runtime >> .gitignore
  - echo build/worker >> .gitignore
  - echo node_modules >> .gitignore
  - echo "src/arr/compiler/ts-*.js" >> .gitignore
  - echo src/runtime-arr/compiled >> .gitignore
  - echo src/runtime-arr-preludes/compiled >> .gitignore
deploy:
  provider: heroku
  app: th-pyret-lang
  api_key:
    secure: 
  on:
    all-branches: true
  environment:
    NODE_ENV: production
  skip_cleanup: true
